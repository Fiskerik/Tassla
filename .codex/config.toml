# Tassla – Codex project config
# Active subagents live in .codex/agents/*.toml (one file per agent).
# Dev roles are configured in agents/; app work is gated by approved segment and plan.

# The main session is the orchestrator. Sol is a good default;
# Choose stronger models explicitly only when needed.
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

[agents]
max_concurrent_threads_per_session = 2 # at most two spawned agents
max_depth = 1     # the main session can spawn agents; they cannot spawn further

# If subagents are not available in your Codex version, try enabling:
# [features]
# multi_agent = true
