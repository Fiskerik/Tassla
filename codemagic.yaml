workflows:
  tassla-ios:
    name: Tassla iOS — manual TestFlight build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: tassla-app-store
    environment:
      node: 24
      xcode: 26.6
      groups:
        - tassla-mobile
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.erimaliab.tassla
      vars:
        XCODE_WORKSPACE: Tassla.xcworkspace
        XCODE_SCHEME: Tassla
        EXPO_NO_DOTENV: "1"
        CI: "1"
    scripts:
      - name: Install locked dependencies
        script: |
          set -eu
          npx --yes pnpm@11.19.0 install --frozen-lockfile
      - name: Check application
        script: npx --yes pnpm@11.19.0 check
      - name: Verify public app configuration
        script: |
          node -e 'for (const key of ["EXPO_PUBLIC_SUPABASE_URL", "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"]) { if (!process.env[key]) throw new Error("Missing " + key); }'
      - name: Generate iOS project
        script: |
          set -eu
          node node_modules/expo/bin/cli prebuild --platform ios --no-install
          cd ios
          pod install
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Build signed application
        script: |
          xcode-project build-ipa --workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
